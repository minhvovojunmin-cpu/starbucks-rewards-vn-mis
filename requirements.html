<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yêu cầu hệ thống · Starbucks Rewards Vietnam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="assets/common.js"></script>
</head>
<body class="bg-sb-cream text-slate-700">
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 py-10">
  <p class="text-sm font-bold uppercase tracking-widest text-sb-green">Yêu cầu hệ thống</p>
  <h1 class="mt-2 text-3xl md:text-4xl font-black text-sb-dark">Yêu cầu chức năng &amp; phi chức năng</h1>
  <p class="mt-3 max-w-3xl text-slate-600">Nhấn vào từng yêu cầu để xem cách prototype đáp ứng và đi tới khu vực liên quan.</p>

  <div id="filters" class="mt-6 flex flex-wrap gap-2"></div>
  <div id="grid" class="mt-6 grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>

<div id="site-footer"></div>

<script>
SB.header('req');
SB.footer();

const PAGE = { app: ['customer-app.html', '📱 App khách hàng'], kds: ['kds.html', '🖥️ KDS Barista'], roi: ['roi.html', '📈 Bảng ROI'] };
const G = {
  all: 'Tất cả', fr: 'Chức năng (FR)', nfr: 'Phi chức năng (NFR)',
  g1: 'FR · Tích Sao & Hồ sơ', g2: 'FR · Cá nhân hóa', g3: 'FR · Tải trọng cửa hàng',
  n1: 'NFR · Hiệu năng', n2: 'NFR · Mở rộng', n3: 'NFR · Chính xác & Bảo mật'
};

/* id, group, title, summary, how it is addressed, pages */
const R = [
  ['FR-01', 'g1', 'Quy tắc tích Sao cấu hình được', 'Xác định điều kiện tích Sao theo hạng, hình thức thanh toán, khuyến mãi.', ['Bộ quy tắc (rule engine) cấu hình, không hard-code theo hình thức thanh toán.', 'Màn Thanh toán hiển thị "+N Sao" và nhấn để xem quy tắc đã áp dụng.'], ['app']],
  ['FR-02', 'g1', 'Sổ cái Sao thời gian thực dùng chung', 'Một sổ cái cho ứng dụng, thẻ và cửa hàng.', ['Mọi kênh ghi vào cùng ledger, số dư nhất quán.', 'Kiến trúc event-driven; mỗi giao dịch có mã định danh duy nhất.'], ['app']],
  ['FR-03', 'g1', 'Hồ sơ thành viên hợp nhất', 'Gộp lịch sử mua, sở thích, tiến độ hạng, sự đồng thuận.', ['Customer 360 làm nguồn cho cá nhân hóa ưu đãi.', 'Chỉ dùng dữ liệu khi có đồng thuận.'], ['app']],
  ['FR-04', 'g2', 'Chọn ưu đãi riêng & ghi log yếu tố', 'Mỗi thành viên nhận ưu đãi riêng, có log các yếu tố cấu thành.', ['App có liên kết "Vì sao tôi nhận được ưu đãi này?" hiển thị lịch sử, sở thích, hạng, quy tắc.'], ['app']],
  ['FR-05', 'g2', 'Gửi ưu đãi qua app & email có giới hạn tần suất', 'Tôn trọng giới hạn số lần gửi.', ['Bộ đếm tần suất theo thành viên / tuần (ví dụ 2/3 ưu đãi).'], ['app']],
  ['FR-06', 'g2', 'Xác thực đổi thưởng thời gian thực', 'Kiểm tra hợp lệ ngay khi đổi thưởng.', ['Kiểm tra số dư, hạn dùng, giới hạn và gian lận tại thời điểm thanh toán.'], ['app']],
  ['FR-07', 'g2', 'Dự báo số đơn trước chương trình ưu đãi', 'Ước lượng số đơn phát sinh để chuẩn bị nhân sự / nguyên liệu.', ['Mô hình dự báo dùng timestamp từ KDS (FR-11) làm dữ liệu huấn luyện.'], ['kds']],
  ['FR-08', 'g3', 'Giám sát tải trọng cửa hàng liên tục', 'Dựa trên đơn đang mở, nhân viên ca trực và trạng thái quầy.', ['KDS hiển thị đơn mở, thời gian chờ TB, đơn quá 10 phút.', 'Tải = đơn mở ÷ năng lực quầy; nhấn nút Tải để xem chi tiết.'], ['kds', 'app']],
  ['FR-09', 'g3', 'Kiểm soát tự động theo mức, có log & ghi đè', 'Tăng thời gian chờ → trì hoãn ưu đãi → tiết chế đơn di động → tạm dừng.', ['App đổi banner, ẩn ưu đãi, khóa nút đặt theo 4 mức.', 'Quản lý ghi đè trên KDS; mọi thay đổi vào nhật ký.'], ['app', 'kds']],
  ['FR-10', 'g3', 'Tự khôi phục nhận đơn khi tải giảm', 'Không cần thao tác thủ công.', ['Ở chế độ tự động, hoàn thành đơn trên KDS làm tải giảm và mức kiểm soát tự hạ.'], ['kds']],
  ['FR-11', 'g3', 'Ghi timestamp để cải thiện dự báo', 'Lưu thời điểm tạo, bắt đầu, hoàn thành của mỗi đơn.', ['Mỗi ticket KDS có mốc thời gian; dữ liệu nuôi mô hình dự báo thời gian chờ.'], ['kds']],
  ['NFR-01', 'n1', 'Số dư Sao < 5 giây, hồ sơ < 60 giây (P95)', 'Cập nhật nhanh sau giao dịch.', ['Luồng sự kiện bất đồng bộ; cập nhật số dư ưu tiên, hồ sơ đồng bộ sau.'], ['app']],
  ['NFR-02', 'n1', 'Tín hiệu tải ≤ 10 giây, tới app ≤ 5 giây', 'Làm mới tải trọng và đẩy quyết định dung lượng.', ['Banner trong app có bộ đếm "làm mới sau 10 giây".'], ['app', 'kds']],
  ['NFR-03', 'n1', 'Quyết định ưu đãi trong app < 300 ms', 'Phản hồi gần như tức thì.', ['Ưu đãi được tính sẵn từ hồ sơ hợp nhất và cache.'], ['app']],
  ['NFR-04', 'n2', '36 triệu thành viên (x2), đỉnh gấp 3 ngày hội viên', 'Co giãn theo tải.', ['Hạ tầng cloud tự mở rộng; chi phí cloud nằm trong OPEX.'], ['roi']],
  ['NFR-05', 'n2', '41.000+ cửa hàng không cần thiết lập từng nơi', 'Triển khai đa-cửa-hàng theo cấu hình.', ['Một mẫu cấu hình dùng chung; tham số theo cửa hàng (số quầy, ca) tự phát hiện.'], ['roi']],
  ['NFR-06', 'n2', 'Sẵn sàng 99,95%/tháng, xếp hàng offline', 'Chịu lỗi khi mất kết nối đám mây.', ['KDS và POS xếp hàng giao dịch cục bộ rồi đồng bộ lại khi có mạng.'], ['kds']],
  ['NFR-07', 'n3', 'Cộng Sao đúng một lần, đối soát hàng ngày', 'Exactly-once.', ['Khóa idempotency cho mỗi giao dịch; job đối soát hằng ngày.'], ['app']],
  ['NFR-08', 'n3', 'Quyền riêng tư, PCI DSS, giới hạn lưu trữ', 'Bảo vệ giá trị lưu trữ và dữ liệu cá nhân.', ['Tokenization thẻ, mã hóa, chính sách xóa dữ liệu theo thời hạn.'], ['app']],
  ['NFR-09', 'n3', 'Truy xuất nguồn gốc ưu đãi & kiểm soát dung lượng', 'Mỗi quyết định gắn với đầu vào và quy tắc.', ['"Vì sao tôi nhận ưu đãi" ở app và Nhật ký kiểm soát trên KDS.'], ['app', 'kds']]
];

const q = new URLSearchParams(location.search);
let cur = q.get('g') || 'all';

function match(r) { return cur === 'all' || cur === r[1] || (cur === 'fr' && r[0].startsWith('FR')) || (cur === 'nfr' && r[0].startsWith('NFR')); }

function render() {
  document.getElementById('filters').innerHTML = Object.entries(G).map(([k, v]) =>
    `<button data-g="${k}" class="px-4 py-2 rounded-full text-sm font-bold ${k === cur ? 'bg-sb-green text-white' : 'bg-white text-sb-dark border border-black/5 hover:bg-sb-light'}">${v}</button>`).join('');
  document.getElementById('grid').innerHTML = R.filter(match).map(r => {
    const dark = r[1] === 'g3';
    return `<div role="button" tabindex="0" data-req="${r[0]}" class="clickable rounded-3xl p-6 border ${dark ? 'bg-sb-dark text-white border-sb-dark' : 'bg-white border-black/5'}">
      <div class="flex items-center justify-between"><span class="text-xs font-extrabold px-2.5 py-1 rounded-full ${dark ? 'bg-sb-neon text-sb-dark' : r[0].startsWith('FR') ? 'bg-sb-light text-sb-green' : 'bg-sb-gold/25 text-amber-800'}">${r[0]}</span>
        <span class="text-xs ${dark ? 'text-white/50' : 'text-slate-400'}">${r[5].map(p => PAGE[p][1].split(' ')[0]).join(' ')}</span></div>
      <h3 class="mt-3 font-extrabold leading-snug ${dark ? '' : 'text-sb-dark'}">${r[2]}</h3>
      <p class="mt-2 text-sm ${dark ? 'text-white/70' : 'text-slate-500'}">${r[3]}</p></div>`;
  }).join('');
}

function open(id) {
  const r = R.find(x => x[0] === id); if (!r) return;
  SB.modal({
    icon: r[0].startsWith('FR') ? '🧩' : '🛡️', title: `${r[0]} · ${r[2]}`,
    html: `<p>${r[3]}</p><p class="mt-4 font-bold text-sb-dark">Cách prototype đáp ứng</p><ul class="mt-2 list-disc ml-5 space-y-1.5">${r[4].map(x => `<li>${x}</li>`).join('')}</ul>`,
    actions: r[5].map((p, i) => ({ label: PAGE[p][1] + ' →', href: PAGE[p][0], primary: i === 0 }))
  });
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-g]'); if (g) { cur = g.dataset.g; render(); return; }
  const c = e.target.closest('[data-req]'); if (c) open(c.dataset.req);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-req]')) { e.preventDefault(); open(e.target.dataset.req); } });

render();
if (q.get('open')) open(q.get('open'));
</script>
</body>
</html>
