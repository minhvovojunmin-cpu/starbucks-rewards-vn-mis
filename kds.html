<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barista KDS · Starbucks Rewards Vietnam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script src="assets/common.js"></script>
  <style>
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
    .kds-bg{background:radial-gradient(900px 500px at 10% -10%,rgba(0,112,74,.5),transparent 60%),#08160f}
  </style>
</head>
<body class="bg-[#050d0a] text-white">
<div id="site-header"></div>

<main id="main" class="max-w-[1500px] mx-auto px-3 sm:px-6 py-6">
  <p class="embed-hide text-sm text-white/60 mb-3 px-1">Giao diện tablet (ngang) · Đơn đặt từ App hiện ở cột phải kèm tên khách · Mọi ticket, nút và chỉ số đều nhấn được.</p>

  <div id="bezel" class="rounded-[2.2rem] bg-slate-800 p-3 shadow-[0_40px_90px_-30px_rgba(0,0,0,.9)] ring-1 ring-white/10">
    <div id="kds" class="kds-bg rounded-[1.7rem] overflow-hidden flex flex-col h-[860px] min-h-[640px]">

      <!-- hàng 1: thương hiệu + hành động -->
      <div class="bg-sb-dark px-5 py-3 flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-white/10">
        <a id="kdsHome" href="index.html" class="flex items-center gap-3" title="Về trang chủ" aria-label="Starbucks – về trang chủ">
          <span id="kdsLogo" class="bg-white rounded-full p-0.5"></span>
          <span class="leading-tight"><span class="block font-extrabold text-lg">Barista Station</span><span class="block text-[11px] text-sb-neon font-bold uppercase tracking-wider">KDS · Đồng bộ địa điểm theo App</span></span>
        </a>
        <button id="btnStore" class="mr-auto px-3.5 py-2 rounded-xl bg-sb-green/35 ring-1 ring-sb-neon/60 hover:bg-sb-green/55 text-left transition flex items-center gap-2">
          <span class="text-base leading-none">📍</span>
          <span class="leading-tight">
            <span class="block text-[10px] uppercase tracking-wider text-sb-neon font-extrabold">Chi nhánh đang hiển thị</span>
            <span id="kdsStoreName" class="block text-xs sm:text-sm font-extrabold text-white">Starbucks Nguyễn Huệ · Q.1, TP.HCM</span>
          </span>
          <span class="text-xs text-white/70 ml-1">▾</span>
        </button>
        <button id="btnWalk" class="px-4 py-2.5 rounded-xl bg-amber-400 text-black text-sm font-extrabold hover:brightness-110">＋ Đơn tại quầy</button>
        <button id="btnStock" class="px-4 py-2.5 rounded-xl bg-white/10 ring-1 ring-white/25 text-sm font-extrabold hover:bg-white/20 flex items-center gap-2">📦 Tồn kho <b id="stockBadge" class="hidden min-w-[22px] h-[22px] px-1.5 rounded-full bg-red-600 text-white text-xs grid place-items-center"></b></button>
        <button id="btnLoad" class="px-4 py-2.5 rounded-xl text-sm font-extrabold flex items-center gap-2"></button>
        <span id="clock" class="mono text-xl font-extrabold tabular-nums w-[78px] text-right">--:--</span>
      </div>

      <!-- hàng 2: chỉ số + chú thích -->
      <div class="px-5 py-2.5 flex flex-wrap items-center gap-2 border-b border-white/10 bg-black/20">
        <div id="stats" class="flex flex-wrap items-center gap-2"></div>
        <button id="btnLegend" class="ml-auto flex items-center gap-3 px-3 py-1.5 rounded-xl bg-white/5 text-xs font-semibold hover:bg-white/10">
          <span class="flex items-center gap-1"><i class="w-3 h-3 rounded-full bg-emerald-400"></i>&lt; 4 phút</span>
          <span class="flex items-center gap-1"><i class="w-3 h-3 rounded-full bg-amber-400"></i>4–10</span>
          <span class="flex items-center gap-1"><i class="w-3 h-3 rounded-full bg-red-500"></i>&gt; 10</span>
        </button>
      </div>

      <!-- 2 cột 50/50 -->
      <div class="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
        <section class="min-h-0 flex flex-col rounded-3xl overflow-hidden bg-[#0d1f18] ring-2 ring-amber-400/60" aria-label="Đơn tại quầy">
          <div class="px-5 py-3.5 flex items-center justify-between bg-amber-400 text-black">
            <div class="flex items-center gap-3">
              <span class="w-10 h-10 rounded-xl bg-black/15 grid place-items-center text-xl">🏪</span>
              <div><h2 class="font-black tracking-wide leading-tight">ĐƠN TẠI QUẦY <span class="font-extrabold opacity-70">(WALK-IN)</span></h2><p id="subWalk" class="text-xs font-semibold opacity-70"></p></div>
            </div>
            <span id="cntWalk" class="mono text-3xl font-extrabold"></span>
          </div>
          <div id="colWalk" class="flex-1 overflow-y-auto no-scrollbar p-3.5 space-y-3"></div>
        </section>

        <section class="min-h-0 flex flex-col rounded-3xl overflow-hidden bg-[#0d1f18] ring-2 ring-sb-neon/70" aria-label="Đơn App">
          <div class="px-5 py-3.5 flex items-center justify-between bg-sb-green text-white">
            <div class="flex items-center gap-3">
              <span class="w-10 h-10 rounded-xl bg-black/20 grid place-items-center text-xl">📱</span>
              <div><h2 class="font-black tracking-wide leading-tight">ĐƠN APP <span class="font-extrabold opacity-80">(MOBILE ORDER)</span></h2><p id="subApp" class="text-xs font-semibold opacity-80"></p></div>
            </div>
            <span id="cntApp" class="mono text-3xl font-extrabold text-sb-neon"></span>
          </div>
          <div id="colApp" class="flex-1 overflow-y-auto no-scrollbar p-3.5 space-y-3"></div>
        </section>
      </div>

      <div class="px-5 py-2.5 border-t border-white/10 flex flex-wrap items-center justify-between gap-3 text-xs text-white/60">
        <span>Đồng bộ trực tiếp với App · Sắp xếp: đơn chờ lâu nhất lên đầu</span>
        <div class="flex gap-2">
          <button id="btnNew" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 font-semibold text-white">⚡ Mô phỏng đơn ngẫu nhiên</button>
          <a href="customer-app.html" target="_blank" class="embed-hide px-3 py-1.5 rounded-lg bg-sb-green hover:bg-sb-mid font-semibold text-white">Mở App ↗</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script>
SB.header('kds', true);
SB.footer();
document.getElementById('kdsLogo').innerHTML = SB.logo(42);
if (SB.embed) {
  document.getElementById('kdsHome').target = '_top';
  document.getElementById('main').className = 'p-2';
  document.getElementById('bezel').className = 'rounded-2xl bg-slate-800 p-1.5';
  document.getElementById('kds').style.height = 'calc(100vh - 28px)';
}

/* ---------- hằng số ---------- */
const CAPACITY = 12;               // 4 quầy × 3 đơn
const TONE = {
  g: { bar: 'bg-emerald-400', chip: 'bg-emerald-400 text-black',               name: 'Xanh · dưới 4 phút' },
  y: { bar: 'bg-amber-400',   chip: 'bg-amber-400 text-black',                 name: 'Vàng · 4–10 phút' },
  r: { bar: 'bg-red-500',     chip: 'bg-red-600 text-white sb-pulse-red',      name: 'Đỏ · trên 10 phút' }
};
const LV = [
  { n: 'Mức 0 · Bình thường', short: 'BÌNH THƯỜNG', btn: 'bg-emerald-500 text-black',  desc: 'Không có can thiệp. Thời gian chờ hiển thị ~5 phút.', counters: '4/4' },
  { n: 'Mức 1 · Đông',        short: 'ĐÔNG',         btn: 'bg-amber-400 text-black',    desc: 'Tăng thời gian chờ hiển thị trên app (~15 phút).', counters: '3/4' },
  { n: 'Mức 2 · Quá tải',     short: 'QUÁ TẢI',      btn: 'bg-orange-500 text-black',   desc: 'Trì hoãn ưu đãi, tiết chế nhận đơn di động (~25 phút).', counters: '2/4' },
  { n: 'Mức 3 · Tạm dừng',    short: 'TẠM DỪNG',     btn: 'bg-red-600 text-white sb-pulse-red', desc: 'Tạm dừng nhận đơn di động cho đến khi tải giảm.', counters: '1/4' }
];

let ST = SB.state.get();
let mute = () => {};
const fresh = new Set();           // ticket mới từ App → làm nổi bật
function save(fn) { ST = SB.state.mutate(fn); mute(); }

/* ---------- helpers ---------- */
const curStore = () => SB.store(ST);
const secs = t => Math.max(0, Math.floor((Date.now() - t.start) / 1000));
const tone = s => s < 240 ? 'g' : s < 600 ? 'y' : 'r';
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const esc = SB.esc;
const walk = () => ST.tickets.filter(t => t.src === 'walk').sort((a, b) => a.start - b.start);
const app = () => ST.tickets.filter(t => t.src === 'app').sort((a, b) => a.start - b.start);
const affected = k => SB.MENU.filter(m => (m.ing || []).includes(k));
function autoLevel(n) { const r = n / CAPACITY; return r < 0.5 ? 0 : r < 0.8 ? 1 : r < 1.1 ? 2 : 3; }
function addLog(st, level, actor, reason) {
  st.logs = [{ at: new Date().toISOString(), level, actor, reason, open: st.tickets.length, counters: LV[level].counters, rule: 'LOAD-RULE v1.4' }].concat(st.logs).slice(0, 20);
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.12, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .35); o.start(); o.stop(c.currentTime + .36); } catch (e) {}
}

/* ---------- render ---------- */
function itemsText(i) { return esc(i.n); }
function ticketHTML(t) {
  const s = secs(t), k = TONE[tone(s)], isApp = t.src === 'app';
  return `
  <article role="button" tabindex="0" data-t="${t.id}" class="clickable relative rounded-2xl bg-[#14302a] ring-1 ring-white/15 overflow-hidden hover:ring-sb-neon/60 ${fresh.has(t.id) ? 'sb-flash' : ''}">
    <span data-bar="${t.id}" class="absolute left-0 top-0 bottom-0 w-2 ${k.bar}"></span>
    <div class="pl-5 pr-4 py-3.5">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="mono text-xl font-extrabold">#${t.id}</span>
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${isApp ? 'bg-sb-green text-white' : 'bg-amber-400 text-black'}">${isApp ? '📱 APP' : '🏪 QUẦY'}</span>
            ${t.status === 'making' ? '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-sb-neon text-sb-dark">ĐANG LÀM</span>' : ''}
            ${fresh.has(t.id) ? '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-white text-black">MỚI</span>' : ''}
          </div>
          <p class="mt-1 text-lg font-extrabold leading-tight truncate">👤 ${esc(t.name)}</p>
          <p class="text-xs text-white/65 font-semibold">📍 ${esc(curStore().short)} · ${isApp ? '⏰' : '🏪'} ${esc(t.where)}</p>
        </div>
        <span data-timer="${t.id}" class="mono text-xl font-extrabold px-3 py-2 rounded-xl shrink-0 ${k.chip}">⏱ ${fmt(s)}</span>
      </div>
      <ul class="mt-3 space-y-2 border-t border-white/10 pt-3">
        ${t.items.map(i => `<li class="flex gap-2.5">
          <b class="mono w-8 text-lg text-sb-neon">${i.q}×</b>
          <div class="flex-1"><p class="font-bold leading-tight">${itemsText(i)} ${i.s ? `<span class="text-white/55 font-semibold">· ${esc(i.s)}</span>` : ''}</p>
          ${i.m.length ? `<div class="mt-1 flex flex-wrap gap-1.5">${i.m.map(m => `<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-white/15 text-white">${esc(m)}</span>`).join('')}</div>` : ''}</div></li>`).join('')}
      </ul>
      <button data-act="${t.status === 'making' ? 'done' : 'start'}" data-id="${t.id}" class="mt-3 w-full py-2.5 rounded-xl text-sm font-extrabold transition ${t.status === 'making' ? 'bg-sb-neon text-sb-dark hover:brightness-110' : 'bg-white/15 hover:bg-white/25'}">${t.status === 'making' ? '✓ Hoàn thành' : '▶ Bắt đầu làm'}</button>
    </div>
  </article>`;
}

function render() {
  const w = walk(), a = app();
  const empty = '<div class="h-full grid place-items-center text-white/40 text-sm py-10">Không có đơn đang chờ ✨</div>';
  const sw = document.getElementById('colWalk'), sa = document.getElementById('colApp'), tw = sw.scrollTop, ta = sa.scrollTop;
  sw.innerHTML = w.map(ticketHTML).join('') || empty;
  sa.innerHTML = a.map(ticketHTML).join('') || empty;
  sw.scrollTop = tw; sa.scrollTop = ta;
  document.getElementById('cntWalk').textContent = w.length;
  document.getElementById('cntApp').textContent = a.length;
  const avg = l => l.length ? fmt(Math.round(l.reduce((s, t) => s + secs(t), 0) / l.length)) : '--:--';
  document.getElementById('subWalk').textContent = 'Chờ trung bình ' + avg(w) + ' · ' + curStore().short;
  document.getElementById('subApp').textContent = 'Chờ trung bình ' + avg(a) + ' · ' + curStore().short;
  renderBar();
}

function renderBar() {
  const L = LV[ST.load], n = ST.tickets.length;
  const sn = document.getElementById('kdsStoreName');
  if (sn) sn.textContent = curStore().name;
  const avgAll = n ? fmt(Math.round(ST.tickets.reduce((s, t) => s + secs(t), 0) / n)) : '--:--';
  const late = ST.tickets.filter(t => secs(t) >= 600).length;
  document.getElementById('stats').innerHTML = [
    ['open', n, 'Đơn mở', 'text-white'], ['avg', avgAll, 'Chờ TB', 'text-white'],
    ['late', late, 'Quá 10 phút', late ? 'text-red-400' : 'text-emerald-400'], ['done', ST.done, 'Xong hôm nay', 'text-sb-neon']
  ].map(([k, v, l, c]) => `<button data-stat="${k}" class="px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-center min-w-[92px]"><span class="mono block text-lg font-extrabold leading-tight ${c}">${v}</span><span class="block text-[10px] uppercase tracking-wider text-white/60">${l}</span></button>`).join('');
  const b = document.getElementById('btnLoad');
  b.className = 'px-4 py-2.5 rounded-xl text-sm font-extrabold flex items-center gap-2 ' + L.btn;
  b.innerHTML = `<span class="w-2 h-2 rounded-full bg-current"></span> TẢI: ${L.short} <span class="text-[10px] opacity-75 font-bold">${ST.mode === 'manual' ? '· GHI ĐÈ' : '· TỰ ĐỘNG'}</span>`;
  const sb = document.getElementById('stockBadge'), cnt = Object.keys(ST.oos).length;
  sb.textContent = cnt; sb.classList.toggle('hidden', !cnt);
}

function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  ST.tickets.forEach(t => {
    const s = secs(t), k = TONE[tone(s)];
    const el = document.querySelector(`[data-timer="${t.id}"]`);
    if (el) { el.textContent = '⏱ ' + fmt(s); el.className = 'mono text-xl font-extrabold px-3 py-2 rounded-xl shrink-0 ' + k.chip; }
    const bar = document.querySelector(`[data-bar="${t.id}"]`);
    if (bar) bar.className = 'absolute left-0 top-0 bottom-0 w-2 ' + k.bar;
  });
}

/* ---------- tự động kiểm soát tải (FR-08..FR-10) ---------- */
function evaluateLoad() {
  if (ST.mode === 'manual') return;
  const lvl = autoLevel(ST.tickets.length);
  if (lvl !== ST.load) {
    const dir = lvl > ST.load ? 'Tăng mức kiểm soát' : 'Tự khôi phục nhận đơn';
    save(st => { st.load = lvl; addLog(st, lvl, 'Tự động', `${dir}: ${st.tickets.length}/${CAPACITY} đơn so với năng lực quầy`); });
    SB.toast(`${dir} → ${LV[lvl].n}`, lvl > 1 ? 'warn' : undefined);
  }
}

/* ---------- modal ---------- */
function storeKdsModal() {
  const curId = curStore().id;
  SB.modal({
    dark: true, icon: '📍', title: 'Chi nhánh KDS (đồng bộ theo điện thoại)',
    html: `<p class="text-white/75 text-sm mb-3">Màn hình KDS luôn hiển thị theo địa điểm được chọn trên App điện thoại. Bạn cũng có thể đổi trực tiếp tại đây:</p>
    <div class="space-y-2">${SB.STORES.map(s => {
      const on = s.id === curId;
      return `<button data-kstore="${s.id}" class="w-full text-left p-3.5 rounded-xl border-2 ${on ? 'border-sb-neon bg-sb-green/35' : 'border-white/10 bg-white/5 hover:bg-white/10'} flex items-center justify-between gap-3 transition">
        <span><b class="text-white">${esc(s.name)}</b><br><span class="text-xs text-white/60">Khoảng cách: ${esc(s.dist)}</span></span>
        <span class="text-xs font-extrabold px-2.5 py-1 rounded-full ${on ? 'bg-sb-neon text-sb-dark' : 'bg-white/10 text-white/70'}">${on ? '✓ Đang hiển thị' : 'Chọn'}</span>
      </button>`;
    }).join('')}</div>`,
    onOpen: el => el.querySelectorAll('[data-kstore]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.kstore;
      save(st => { st.store = id; });
      SB.closeModal(); render();
      SB.toast('📍 Đã chuyển KDS & App sang: ' + curStore().name, 'ok');
    }))
  });
}

function ticketModal(id) {
  const t = ST.tickets.find(x => x.id === id); if (!t) return;
  const s = secs(t), k = tone(s), isApp = t.src === 'app';
  SB.modal({
    dark: true, icon: isApp ? '📱' : '🏪', title: `#${t.id} · ${esc(t.name)}`,
    html: `
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="rounded-xl bg-white/10 p-3"><p class="mono text-xl font-extrabold ${k === 'r' ? 'text-red-400' : k === 'y' ? 'text-amber-300' : 'text-emerald-400'}">${fmt(s)}</p><p class="text-[11px] text-white/60">Đã chờ</p></div>
      <div class="rounded-xl bg-white/10 p-3"><p class="font-extrabold">${isApp ? 'App' : 'Walk-in'}</p><p class="text-[11px] text-white/60">Nguồn đơn</p></div>
      <div class="rounded-xl bg-white/10 p-3"><p class="font-extrabold">${t.status === 'making' ? 'Đang làm' : 'Chờ làm'}</p><p class="text-[11px] text-white/60">Trạng thái</p></div>
    </div>
    <p class="mt-4 text-white/60 text-xs uppercase tracking-wider font-bold">Món &amp; tùy chỉnh</p>
    <ul class="mt-2 space-y-2">${t.items.map(i => `<li class="p-3 rounded-xl bg-white/10"><b>${i.q}× ${esc(i.n)}</b> <span class="text-white/60">${esc(i.s || '')}</span>${i.m.length ? `<div class="mt-1.5 flex flex-wrap gap-1.5">${i.m.map(m => `<span class="text-xs px-2 py-0.5 rounded-md bg-sb-green text-white">${esc(m)}</span>`).join('')}</div>` : '<p class="text-xs text-white/50 mt-1">Không tùy chỉnh</p>'}</li>`).join('')}</ul>
    <div class="mt-4 text-sm text-white/80 space-y-1">
      <p>👤 Khách hàng: <b>${esc(t.name)}</b></p>
      <p>📍 Chi nhánh: <b>${esc(curStore().name)}</b></p>
      <p>${isApp ? '⏰' : '🏪'} ${esc(t.where)}</p>
      ${isApp ? `<p>⭐ Thành viên Rewards · Sao ghi sổ sau khi hoàn thành (exactly-once)</p>${t.total ? `<p>💳 Đã thanh toán: <b>${SB.money(t.total)}</b></p>` : ''}` : '<p>👤 Khách đang đứng chờ tại quầy – ưu tiên làm nhanh</p>'}
    </div>`,
    actions: [
      { label: '⚠️ Báo hết nguyên liệu', onClick: stockModal },
      t.status === 'making' ? { label: '✓ Hoàn thành', primary: true, onClick: () => finish(id) } : { label: '▶ Bắt đầu làm', primary: true, onClick: () => start(id) }
    ]
  });
}

function stockModal() {
  SB.modal({
    dark: true, wide: true, icon: '📦', title: 'Tồn kho nguyên liệu · ' + curStore().name,
    html: `<p class="text-white/70">Đánh dấu <b>hết nguyên liệu</b> → mọi món dùng nguyên liệu đó bị khóa trên App tại <b>${esc(curStore().short)}</b> trong &lt; 5 giây, kèm thẻ cảnh báo đỏ cho khách.</p>
    <div id="stk" class="mt-3 grid sm:grid-cols-2 gap-2"></div>`,
    actions: [{ label: 'Xem trên App', href: 'customer-app.html' }, { label: 'Xong', primary: true }],
    onOpen: el => {
      const box = el.querySelector('#stk');
      const draw = () => {
        box.innerHTML = Object.keys(SB.ING).map(k => {
          const out = !!ST.oos[k], list = affected(k);
          return `<button data-k="${k}" class="text-left p-3 rounded-xl border-2 ${out ? 'bg-red-600/25 border-red-500' : 'bg-white/5 border-white/10 hover:bg-white/10'} flex items-center gap-3">
            <span class="text-2xl">${SB.ING[k].ico}</span>
            <span class="flex-1 min-w-0"><b>${SB.ING[k].name}</b><br><span class="text-[11px] text-white/60">${list.length ? 'Dùng cho: ' + list.map(m => esc(m.name)).join(', ') : 'Dùng cho tuỳ chọn sữa'}</span></span>
            <span class="text-[11px] font-extrabold px-2.5 py-1 rounded-full ${out ? 'bg-red-600 text-white' : 'bg-emerald-500 text-black'}">${out ? 'HẾT' : 'CÒN'}</span></button>`;
        }).join('');
      };
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-k]'); if (!b) return;
        const k = b.dataset.k, was = !!ST.oos[k];
        save(st => { if (was) delete st.oos[k]; else st.oos[k] = true; });
        draw(); renderBar();
        SB.toast(was ? `Đã báo CÒN ${SB.ING[k].name} – app mở lại ${affected(k).length} món` : `Đã báo HẾT ${SB.ING[k].name} – app khóa ${affected(k).length} món`, was ? 'ok' : 'warn');
      });
      draw();
    }
  });
}

function loadModal() {
  const logs = ST.logs;
  SB.modal({
    dark: true, wide: true, icon: '🚦', title: 'Kiểm soát tải trọng · ' + curStore().name,
    html: `
    <div class="grid sm:grid-cols-3 gap-2 text-center">
      <div class="rounded-xl bg-white/10 p-3"><p class="mono text-xl font-extrabold">${ST.tickets.length}</p><p class="text-[11px] text-white/60">Đơn đang mở (Walk-in + App)</p></div>
      <div class="rounded-xl bg-white/10 p-3"><p class="mono text-xl font-extrabold">${LV[ST.load].counters}</p><p class="text-[11px] text-white/60">Quầy hoạt động</p></div>
      <div class="rounded-xl bg-white/10 p-3"><p class="mono text-xl font-extrabold">${Math.round(ST.tickets.length / CAPACITY * 100)}%</p><p class="text-[11px] text-white/60">Tải = đơn mở ÷ năng lực (${CAPACITY})</p></div>
    </div>
    <p class="mt-4 text-xs uppercase tracking-wider font-bold text-white/60">Quản lý ghi đè mức kiểm soát</p>
    <div class="mt-2 grid sm:grid-cols-2 gap-2">${LV.map((l, i) => `
      <button data-lv="${i}" class="text-left p-3 rounded-xl ${ST.load === i ? 'ring-2 ring-sb-neon bg-sb-green/30' : 'bg-white/10 hover:bg-white/15'}"><b>${l.n}</b><br><span class="text-xs text-white/70">${l.desc}</span></button>`).join('')}</div>
    <button data-lv="auto" class="mt-2 w-full p-3 rounded-xl ${ST.mode === 'auto' ? 'ring-2 ring-sb-neon bg-sb-green/30' : 'bg-white/10 hover:bg-white/15'} font-bold">↺ Chế độ tự động (tự khôi phục khi tải giảm)</button>
    <p class="mt-5 text-xs uppercase tracking-wider font-bold text-white/60">Nhật ký kiểm soát (truy xuất nguồn gốc)</p>
    <div class="mt-2 space-y-1.5 max-h-48 overflow-y-auto">${logs.length ? logs.map(l => `
      <div class="p-2.5 rounded-lg bg-white/10 text-xs"><b>${new Date(l.at).toLocaleTimeString('vi-VN')}</b> · ${LV[l.level].n} · <span class="text-sb-neon">${esc(l.actor)}</span><br><span class="text-white/70">${esc(l.reason)} · đơn mở ${l.open} · quầy ${l.counters} · ${l.rule}</span></div>`).join('') : '<p class="text-white/50 text-xs">Chưa có hành động nào.</p>'}</div>`,
    onOpen: el => el.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.lv;
      if (v === 'auto') { save(st => { st.mode = 'auto'; addLog(st, st.load, 'Quản lý', 'Trở lại chế độ tự động'); }); evaluateLoad(); SB.toast('Đã bật chế độ tự động'); }
      else { save(st => { st.load = +v; st.mode = 'manual'; addLog(st, +v, 'Quản lý ghi đè', 'Quản lý đặt mức thủ công'); }); SB.toast('Đã áp dụng ' + LV[+v].n); }
      renderBar(); loadModal();
    }))
  });
}

function statModal(k) {
  const late = ST.tickets.filter(t => secs(t) >= 600);
  const info = {
    open: ['📋', 'Đơn đang mở', `<p>${walk().length} đơn Walk-in và ${app().length} đơn App. Đây là đầu vào chính của chỉ số tải trọng (FR-08).</p>`],
    avg: ['⏳', 'Thời gian chờ trung bình', '<p>Tính từ lúc đơn tạo đến hiện tại. Timestamp được ghi lại để cải thiện mô hình dự báo (FR-11).</p>'],
    late: ['🔴', 'Đơn quá 10 phút', late.length ? `<p>Cần ưu tiên: ${late.map(t => '<b>#' + t.id + ' (' + esc(t.name) + ')</b>').join(', ')}.</p>` : '<p>Không có đơn nào quá 10 phút. 👍</p>'],
    done: ['✅', 'Đã hoàn thành hôm nay', `<p>${ST.done} đơn đã hoàn thành trong ca. Mỗi đơn hoàn thành kích hoạt ghi Sao một lần duy nhất (NFR-07).</p>`]
  }[k];
  SB.modal({ dark: true, icon: info[0], title: info[1], html: info[2] });
}

/* đơn tại quầy – tạo thủ công */
function walkModal() {
  const o = { name: 'Khách tại quầy', where: 'Mang đi', size: 'Grande', mods: [], cart: {}, cat: 'coffee' };
  SB.modal({
    dark: true, wide: true, icon: '🏪', title: 'Tạo đơn tại quầy (Walk-in)',
    html: '<div id="wk"></div>',
    onOpen: el => {
      const box = el.querySelector('#wk');
      const chip = (on, attrs, label) => `<button ${attrs} class="px-3 py-1.5 rounded-lg text-xs font-bold border-2 ${on ? 'bg-amber-400 text-black border-amber-400' : 'bg-white/5 border-white/20 hover:bg-white/10'}">${label}</button>`;
      const draw = () => {
        const list = SB.MENU.filter(m => m.cat === o.cat);
        const n = Object.values(o.cart).reduce((s, v) => s + v, 0);
        box.innerHTML = `
        <label class="block"><span class="text-xs font-bold text-white/60 uppercase tracking-wider">Tên khách</span>
          <input id="wkName" value="${esc(o.name)}" class="mt-1 w-full rounded-xl bg-white/10 border-2 border-white/20 px-3 py-2.5 font-bold text-white outline-none focus:border-amber-400"></label>
        <div class="mt-3 flex flex-wrap gap-2">${['Mang đi', 'Dùng tại chỗ'].map(w => chip(o.where === w, `data-where="${w}"`, w)).join('')}
          <span class="mx-1 w-px bg-white/20"></span>${SB.SIZES.map(s => chip(o.size === s.n, `data-size="${s.n}"`, s.n)).join('')}
          <span class="mx-1 w-px bg-white/20"></span>${['Ít ngọt', 'Ít đá', 'Sữa yến mạch', 'Sữa đậu nành'].map(m => chip(o.mods.includes(m), `data-mod="${m}"`, m)).join('')}</div>
        <div class="mt-3 flex gap-2 overflow-x-auto no-scrollbar">${SB.CATS.map(c => `<button data-cat="${c.id}" class="shrink-0 px-3.5 py-2 rounded-full text-sm font-bold ${o.cat === c.id ? 'bg-sb-green text-white' : 'bg-white/10 hover:bg-white/20'}">${c.ico} ${c.name}</button>`).join('')}</div>
        <div class="mt-3 grid sm:grid-cols-2 gap-2">${list.map(m => {
          const bk = SB.blockedBy(m, ST.oos), q = o.cart[m.id] || 0;
          return `<div class="p-2.5 rounded-xl flex items-center gap-2.5 ${bk ? 'bg-red-600/20 opacity-70' : 'bg-white/10'}">
            <span class="text-2xl">${m.ico}</span><span class="flex-1 min-w-0"><b class="text-sm">${m.name}</b><br><span class="text-[11px] ${bk ? 'text-red-300 font-bold' : 'text-white/60'}">${bk ? 'Hết ' + SB.ING[bk].name : SB.money(m.price)}</span></span>
            ${bk ? '' : `<span class="flex items-center gap-1.5"><button data-q="-1" data-id="${m.id}" class="w-8 h-8 rounded-full bg-white/15 font-bold">−</button><b class="w-5 text-center">${q}</b><button data-q="1" data-id="${m.id}" class="w-8 h-8 rounded-full bg-amber-400 text-black font-bold">+</button></span>`}</div>`;
        }).join('')}</div>
        <button data-create ${n ? '' : 'disabled'} class="mt-4 w-full h-12 rounded-xl bg-amber-400 text-black font-extrabold disabled:opacity-40">Tạo đơn · ${n} món</button>`;
      };
      box.addEventListener('input', e => { if (e.target.id === 'wkName') o.name = e.target.value; });
      box.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.where) o.where = b.dataset.where;
        else if (b.dataset.size) o.size = b.dataset.size;
        else if (b.dataset.mod) { const i = o.mods.indexOf(b.dataset.mod); i >= 0 ? o.mods.splice(i, 1) : o.mods.push(b.dataset.mod); }
        else if (b.dataset.cat) o.cat = b.dataset.cat;
        else if (b.dataset.q) { const id = b.dataset.id; o.cart[id] = Math.max(0, (o.cart[id] || 0) + +b.dataset.q); if (!o.cart[id]) delete o.cart[id]; }
        else if ('create' in b.dataset) {
          const name = (o.name || '').trim() || 'Khách tại quầy';
          const items = Object.keys(o.cart).map(id => { const m = SB.item(id); return { q: o.cart[id], id, n: m.name, s: m.drink ? o.size : '', m: m.drink ? o.mods.slice() : [] }; });
          let nid;
          save(st => { nid = 'W-' + st.seq.W; st.seq.W++; st.tickets.push({ id: nid, src: 'walk', name, start: Date.now(), status: 'new', where: o.where, items }); });
          SB.closeModal(); render(); evaluateLoad(); SB.toast(`Đã tạo đơn #${nid} cho ${name}`, 'ok'); return;
        }
        const keep = el.querySelector('#wkName') === document.activeElement; draw();
      });
      draw();
    }
  });
}

/* ---------- hành động ---------- */
function start(id) { save(st => { const t = st.tickets.find(x => x.id === id); if (t) t.status = 'making'; }); render(); }
function finish(id) {
  save(st => {
    const i = st.tickets.findIndex(x => x.id === id); if (i < 0) return;
    st.tickets.splice(i, 1); st.done++;
    st.ready = (st.ready || []).concat(id).slice(-40);
  });
  render(); SB.toast('Hoàn thành #' + id, 'ok'); evaluateLoad();
}
function randomOrder() {
  const isApp = Math.random() > .5, p = isApp ? 'M' : 'W';
  const pool = SB.MENU.filter(m => !SB.blockedBy(m, ST.oos));
  const m = pool[Math.floor(Math.random() * pool.length)];
  const names = ['Khánh Linh', 'Gia Bảo', 'Mai Anh', 'Tuấn Kiệt', 'Ngọc Hân', 'Việt Anh', 'Thanh Tâm', 'Hải Đăng'];
  const name = names[Math.floor(Math.random() * names.length)];
  let id;
  save(st => {
    id = p + '-' + st.seq[p]; st.seq[p]++;
    st.tickets.push({ id, src: isApp ? 'app' : 'walk', name, start: Date.now(), status: 'new', where: isApp ? 'Ngay khi sẵn sàng' : 'Mang đi',
      items: [{ q: 1 + Math.floor(Math.random() * 2), id: m.id, n: m.name, s: m.drink ? 'Grande' : '', m: m.drink ? ['Ít ngọt'] : [] }] });
  });
  render(); evaluateLoad();
}

document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act && !e.target.closest('#sb-modal')) { e.stopPropagation(); act.dataset.act === 'done' ? finish(act.dataset.id) : start(act.dataset.id); return; }
  const t = e.target.closest('[data-t]'); if (t && !e.target.closest('#sb-modal')) { ticketModal(t.dataset.t); return; }
  const s = e.target.closest('[data-stat]'); if (s) statModal(s.dataset.stat);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-t]')) { e.preventDefault(); ticketModal(e.target.dataset.t); } });
document.getElementById('btnStore').addEventListener('click', storeKdsModal);
document.getElementById('btnLoad').addEventListener('click', loadModal);
document.getElementById('btnStock').addEventListener('click', stockModal);
document.getElementById('btnWalk').addEventListener('click', walkModal);
document.getElementById('btnNew').addEventListener('click', () => { randomOrder(); SB.toast('Có đơn mới'); });
document.getElementById('btnLegend').addEventListener('click', () => SB.modal({
  dark: true, icon: '🎨', title: 'Chú thích màu bộ đếm',
  html: `<div class="space-y-2">${Object.values(TONE).map(k => `<div class="flex items-center gap-3 p-3 rounded-xl bg-white/10"><span class="w-3 h-8 rounded ${k.bar}"></span><b>${k.name}</b></div>`).join('')}</div>
  <p class="mt-3 text-white/70">Làm đơn đỏ trước, rồi vàng. Đơn Walk-in luôn có khách đứng chờ; đơn App có giờ hẹn nên ưu tiên theo giờ.</p>`
}));

/* ---------- đồng bộ từ App ---------- */
function onExternal() {
  const before = new Set(ST.tickets.map(t => t.id));
  const prevStore = curStore().id;
  ST = SB.state.get();
  if (curStore().id !== prevStore) {
    const bs = document.getElementById('btnStore');
    if (bs) { bs.classList.remove('sb-flash'); void bs.offsetWidth; bs.classList.add('sb-flash'); }
    SB.toast(`📍 Màn hình KDS đã chuyển sang: ${curStore().name}`, 'ok');
  }
  const added = ST.tickets.filter(t => !before.has(t.id) && t.src === 'app');
  added.forEach(t => {
    fresh.add(t.id); setTimeout(() => { fresh.delete(t.id); render(); }, 8000);
    SB.toast(`📱 Đơn mới #${t.id} từ App · ${t.name} (${curStore().short})`, 'ok'); beep();
  });
  render();
}
mute = SB.state.subscribe(onExternal);

evaluateLoad(); render(); tick();
setInterval(tick, 1000);
setInterval(() => { ST = SB.state.get(); evaluateLoad(); render(); }, 10000);
</script>
</body>
</html>
